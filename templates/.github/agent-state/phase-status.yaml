version: 1
updated: 2026-05-18

# PUNTERO. Es lo que el workflow `quality-verify` lee para decidir que evalua,
# y lo que `sdlc status` usa para su veredicto. Con varios slices en vuelo, lo
# que no este apuntado aqui no lo mira nadie: mantenerlo al dia no es cosmetica.
current_slice: "bootstrap-{{project.slug}}"
current_phase: "F0"
current_phase_name: "Bootstrap"

phases_completed: []

# ESTADO POR SLICE. El puntero de arriba es uno de estos, no el unico estado
# real. `sdlc status` adjudica el phase-gate de CADA entrada y lo reporta en
# `slices`, para que un slice en vuelo no quede invisible solo porque el
# puntero apunta a otro. El veredicto sigue saliendo del puntero: esto informa,
# no cambia lo que bloquea.
slices:
  bootstrap-{{project.slug}}:
    phase: "F0"
    phase_name: "Bootstrap"
    phases_completed: []

canonical_specs:
  - "openspec/specs/business-production-readiness/"
  - "openspec/specs/sdlc-phases/"

phase_owners:
  definition: "analista-requisitos"
  design: "arquitecto"
  api: "api-agent"
  web: "web-agent"
  mobile: "mobile-sync"
  qa: "qa-security-review"
  human_review: "human-review"
  deploy: "release-owner"

control_plane:
  planner: "planificador-opus"
  orchestrator: "orquestador-opus"

entry_criteria:
  - "sdlc install completed"
  - "sdlc doctor reports no errors"
  - "project mode and readiness defaults confirmed"

follow_ups_open: []
