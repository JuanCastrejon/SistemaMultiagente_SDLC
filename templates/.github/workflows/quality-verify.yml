# Arbitro de calidad (ADR 0007, D1)
#
# El harness local calcula los mismos controles, pero se autodeclara advisory:
# corre en la maquina donde el agente escribe. Este workflow es el que cuenta,
# porque RE-EJECUTA los probes y compara lo recomputado contra lo que la
# evidencia declara. Esa discrepancia (`evidence-mismatch`) es el detector de
# fraude: no depende de confiar en quien produjo el YAML.
#
# Requisitos de configuracion, fuera del alcance de este archivo:
#   1. Marcar este check como required status check en la rama protegida.
#   2. Restringir quien puede editar .github/workflows (CODEOWNERS), o el
#      arbitro es editable por el evaluado y no arbitra nada.

name: quality-verify

on:
  pull_request:
  push:
    branches: [{{gitFlow.integrationBranch}}, {{gitFlow.stableBranch}}]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quality-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # El guard de frontera compara contra la rama de integracion remota:
          # sin historia no hay merge-base que valga.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # El gestor de paquetes se DETECTA, no se asume. Hardcodear `npm ci` aqui
      # romperia en cualquier consumidor pnpm o yarn — que es justo el caso del
      # consumidor mas maduro. El engine ya sabe detectarlo desde 1.8.0; el
      # arbitro tiene que ser igual de agnostico.
      - name: Resolver gestor de paquetes
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            echo "install=corepack pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "exec=corepack pnpm exec" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            corepack enable
            echo "install=corepack yarn install --immutable" >> "$GITHUB_OUTPUT"
            echo "exec=corepack yarn exec" >> "$GITHUB_OUTPUT"
          else
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "exec=npx --no-install" >> "$GITHUB_OUTPUT"
          fi

      # El CLI se resuelve por la dependencia declarada y fijada en el lockfile,
      # NUNCA por link al working copy del framework: si el codigo que juzga lo
      # puede editar el juzgado, el arbitro es decorativo.
      - name: Instalar dependencias
        run: ${{ steps.pm.outputs.install }}

      - name: Verificar que el CLI no viene de un link local
        run: |
          RESOLVED=$(node -e "console.log(require.resolve('sistema-multiagente-sdlc/package.json'))" 2>/dev/null || echo "")
          if [ -z "$RESOLVED" ]; then
            echo "El consumidor no declara sistema-multiagente-sdlc como dependencia."
            echo "El arbitro exige una version fijada por lockfile, no un link global."
            exit 1
          fi
          case "$RESOLVED" in
            *node_modules*) echo "CLI resuelto desde node_modules: $RESOLVED" ;;
            *) echo "CLI resuelto FUERA de node_modules ($RESOLVED): posible link local."; exit 1 ;;
          esac

      - name: Resolver slice y fase vigentes
        id: state
        run: |
          SLICE=$(grep -E '^current_slice:' .github/agent-state/phase-status.yaml | sed 's/.*: *//' | tr -d '"')
          PHASE=$(grep -E '^current_phase:' .github/agent-state/phase-status.yaml | sed 's/.*: *//' | tr -d '"')
          echo "slice=$SLICE" >> "$GITHUB_OUTPUT"
          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"

      - name: Gobernanza
        run: ${{ steps.pm.outputs.exec }} sdlc governance-check --target . --json

      # El eje de AUTORIZACION (ADR 0008), adjudicado donde el evaluado no
      # manda.
      #
      # Hasta 2.0.0 este workflow corria `governance-check` y `quality-gate`, y
      # ninguno de los dos mira el gate humano ni las atestaciones: el modelo
      # entero quedaba adjudicado unicamente en la maquina del agente — la misma
      # que la cabecera de este archivo declara *advisory*. Sin este paso, el ADR
      # 0008 describe un acuerdo de caballeros y no un control: no hay evasion
      # que inventar, basta no correr el comando.
      #
      # `phase-gate` es el UNICO que adjudica downgrades (D5). Se le da
      # `--exit-code` porque sin el es informativo, que es justo lo contrario de
      # lo que hace falta aqui.
      - name: Autorizacion (gate humano y downgrades)
        run: >
          ${{ steps.pm.outputs.exec }} sdlc phase-gate
          --target .
          --slice "${{ steps.state.outputs.slice }}"
          --phase "${{ steps.state.outputs.phase }}"
          --exit-code
          --json

      # Aqui esta la diferencia con el harness local: se vuelve a medir.
      - name: Recomputar calidad
        run: >
          ${{ steps.pm.outputs.exec }} sdlc quality-gate
          --target .
          --slice "${{ steps.state.outputs.slice }}"
          --phase "${{ steps.state.outputs.phase }}"
          --run
          --source ci
          --exit-code
          --json

      # Se ejecuta la copia del guard que vive en la rama de integracion, NO la
      # del checkout del PR: si un PR neutraliza su propia copia del script
      # (el ejemplo mas barato: reemplazarla por `process.exit(0)`), ninguna
      # lista de rutas protegidas ayuda si el codigo que arbitra es justo el
      # codigo que el PR controla. `.sdlc/locked-paths.txt` se lee del
      # checkout de todas formas: eso es seguro porque solo puede EXTENDER
      # proteccion, nunca quitarla (ver ALWAYS_LOCKED en el script).
      - name: Frontera de especificacion
        run: |
          # La ref va CALIFICADA a `refs/remotes/`. Con el nombre corto
          # (`origin/<rama>`), las reglas DWIM de gitrevisions prueban
          # `refs/tags/<n>` y `refs/heads/<n>` ANTES que `refs/remotes/<n>`: un
          # tag llamado literalmente `origin/<rama>` apuntando al HEAD del PR
          # hacia que el guard comparara HEAD contra HEAD (diff vacio) Y que
          # este `git show` trajera la copia "confiable" del arbol del atacante.
          # Las dos mitades del control caian a la vez. Reproducido.
          BASE="refs/remotes/origin/{{gitFlow.integrationBranch}}"
          TRUSTED="$RUNNER_TEMP/validate-spec-boundary.trusted.mjs"
          if ! git rev-parse --verify --quiet "$BASE" >/dev/null; then
            echo "::error::$BASE no existe en el checkout. El guard no puede arbitrar contra una base verificable."
            echo "Comprobar que actions/checkout use fetch-depth: 0 y que la rama de integracion exista en origin."
            exit 1
          fi
          if ! git show "$BASE:scripts/validate-spec-boundary.mjs" > "$TRUSTED" 2>/dev/null || [ ! -s "$TRUSTED" ]; then
            # NUNCA se cae a la copia del checkout: el codigo que arbitra seria
            # el que el evaluado controla, que es exactamente lo que este step
            # existe para impedir. "No se pudo medir" no es "aprobado" — la
            # misma regla que el propio guard aplica a su diff.
            echo "::error::$BASE no tiene scripts/validate-spec-boundary.mjs."
            echo "Es el estado de bootstrap: instalar el guard y mergearlo a la rama de integracion ANTES de abrir PRs."
            echo "codigo: spec-boundary-guard-ausente-en-base"
            exit 1
          fi
          node "$TRUSTED" --base "$BASE"

      - name: Publicar evidencia recomputada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence-${{ github.sha }}
          path: |
            .github/agent-state/evidence/**
            coverage/**
            reports/**
          retention-days: 90
          if-no-files-found: ignore
