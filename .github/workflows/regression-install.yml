name: Regression Install

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: install-${{ matrix.mode }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        mode: [greenfield, legacy]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create consumer repo
        run: |
          node -e "require('fs').mkdirSync('tmp-consumer', { recursive: true })"

      - name: Install template
        run: |
          node ./bin/sdlc.js init --target ./tmp-consumer --mode ${{ matrix.mode }} --project-name "Regression ${{ matrix.mode }}" --json

      # Desde 2.0.0 el instalador NO escribe superficies de ejemplo: escribirlas
      # era configuracion activa disfrazada de plantilla, y de ahi salian gates
      # vacuos y firmas sobre el arbol vacio. La consecuencia buscada es que un
      # repo recien instalado salga en ERROR hasta que alguien declare las
      # superficies reales -- incluido este.
      #
      # Se afirma ese error ANTES de configurar, en vez de saltarselo: si algun
      # dia `doctor` dejara de exigirlo, esta regresion tiene que enterarse.
      - name: Doctor sin configurar (tiene que fallar)
        shell: bash
        run: |
          if node ./bin/sdlc.js doctor --target ./tmp-consumer --json > /tmp/doctor-sin-config.json 2>&1; then
            echo "FALLO: doctor deberia salir != 0 con las superficies sin declarar"
            cat /tmp/doctor-sin-config.json
            exit 1
          fi
          grep -q "config-surfaces-empty" /tmp/doctor-sin-config.json || {
            echo "FALLO: doctor fallo, pero no por config-surfaces-empty"
            cat /tmp/doctor-sin-config.json
            exit 1
          }
          echo "OK: doctor exige declarar superficies, como debe"

      # Lo que hace un consumidor de verdad: declarar su superficie y regenerar
      # el contrato desde el config.
      - name: Declarar una superficie real
        shell: bash
        run: |
          mkdir -p ./tmp-consumer/src
          echo "export const x = 1;" > ./tmp-consumer/src/index.js
          node -e "
            const fs = require('fs');
            const p = './tmp-consumer/.sdlc/config.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            // `owner` es obligatorio en el schema; `tier` sale del enum
            // core|standard|shell. Una superficie mal formada haria fallar
            // doctor por config-schema y ocultaria lo que esta regresion mide.
            //
            // Los cuatro riesgos (ADR 0008, RIESGOS_AUTORIZACION) tienen que
            // venir declarados como booleano: sin ellos la superficie queda
            // REALMENTE sin clasificar y `upgrade`/`doctor` salen accion-
            // requerida (2) a proposito — es la regla que 2.0.1 dejo de
            // confundir con 'clasificada con riesgos'. Esta superficie de
            // prueba no es de verdad riesgosa, asi que se clasifica en false.
            c.surfaces = [{
              id: 'src', path: 'src', owner: 'regression', tier: 'standard',
              moneyPath: false, regulatedData: false, securityCritical: false, stateMachineCritical: false
            }];
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          "
      # `quality-contract.yaml` se GENERA desde config.surfaces, asi que editar
      # el config y no regenerar deja drift. Hay que hacer DOS cosas con eso, y
      # la primera es la que se olvido: AFIRMAR que se detecta.
      #
      # Sin este paso, el `upgrade` de abajo borra el estado que esta regresion
      # existe para vigilar -- `diff` solo se observaria ya reparado, y el dia
      # que dejara de ver un contrato desincronizado la matriz seguiria verde.
      # Es exactamente el error que ya se cometio con `doctor` y
      # `config-surfaces-empty`: reparar antes de comprobar deja el control
      # ciego.
      - name: El drift se detecta ANTES de regenerar
        shell: bash
        run: |
          set +e
          salida=$(node ./bin/sdlc.js diff --target ./tmp-consumer --json)
          codigo=$?
          set -e
          echo "$salida"
          SALIDA="$salida" CODIGO="$codigo" node -e '
            const codigo = Number(process.env.CODIGO);
            if (codigo === 0) {
              console.error("::error::diff salio 0 con el contrato desincronizado: la deteccion de drift dejo de funcionar.");
              process.exit(1);
            }
            const payload = JSON.parse(process.env.SALIDA);
            if (payload.status !== "diff") {
              console.error(`::error::se esperaba status=diff y llego status=${payload.status}`);
              process.exit(1);
            }
            const tocados = [...(payload.changed ?? []), ...(payload.missing ?? [])].map((x) => (typeof x === "string" ? x : x?.path ?? ""));
            if (!tocados.some((p) => p.includes("quality-contract.yaml"))) {
              console.error(`::error::diff falla, pero no nombra quality-contract.yaml: ${JSON.stringify(tocados)}`);
              process.exit(1);
            }
          '

      # Y la segunda: repararlo. Es lo que la propia migracion le dice al
      # consumidor que haga, asi que la regresion tiene que hacer lo mismo.
      - name: Regenerar el contrato
        shell: bash
        run: |
          node ./bin/sdlc.js upgrade --target ./tmp-consumer --json

      # `./tmp-consumer` es un directorio de scratch, nunca un `git init`: el
      # eje de autorizacion (ADR 0008, G7) no puede resolver `origin/develop`
      # ahi y avisa `authz-base-unresolvable` SIEMPRE, a proposito (doctor
      # reporta, no bloquea — un clon nuevo sin la rama remota es normal). Es
      # el UNICO hallazgo que esta regresion tolera; cualquier otro sigue
      # rompiendo el job.
      - name: Doctor ya configurado
        shell: bash
        run: |
          set +e
          salida=$(node ./bin/sdlc.js doctor --target ./tmp-consumer --json)
          codigo=$?
          set -e
          echo "$salida"
          SALIDA="$salida" CODIGO="$codigo" node -e '
            const codigo = Number(process.env.CODIGO);
            const payload = JSON.parse(process.env.SALIDA);
            const findings = payload.findings ?? [];
            const inesperados = findings.filter((f) => f.level !== "info" && f.code !== "authz-base-unresolvable");
            if (inesperados.length > 0) {
              console.error(`::error::doctor encontro hallazgos inesperados: ${JSON.stringify(inesperados)}`);
              process.exit(1);
            }
            if (codigo !== 0 && codigo !== 2) {
              console.error(`::error::doctor salio ${codigo}; solo se tolera 0 o 2 por authz-base-unresolvable`);
              process.exit(1);
            }
          '

      - name: Diff
        run: |
          node ./bin/sdlc.js diff --target ./tmp-consumer --json
